<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" width="1180" height="300" role="img" aria-label="Flow 4단계 파이프라인: 기획 → 자산 → 콘티 → 키프레임 → 장면 → 진단">
  <rect width="1180" height="300" fill="#ffffff"/>
  <style>
    .t  { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', 'Malgun Gothic', sans-serif; fill:#1f2328; }
    .hd { font-size:15px; font-weight:700; }
    .sb { font-size:12.5px; fill:#57606a; }
    .st { font-size:11.5px; fill:#8b949e; letter-spacing:.2px; }
    .cp { font-size:12px; font-weight:600; }
    .nt { font-size:12.5px; fill:#57606a; }
  </style>

  <text class="t st" x="25" y="26">FLOW 4단계 — 프롬프트를 내어주는 스킬</text>
  <line x1="25" y1="38" x2="1155" y2="38" stroke="#d0d7de" stroke-width="1"/>

  <!-- 박스 6개 -->
  <g>
    <rect x="25"   y="70" width="170" height="104" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t hd" x="110" y="100" text-anchor="middle">① 기획</text>
    <text class="t sb" x="110" y="124" text-anchor="middle">주제 · 로그라인</text>
    <text class="t sb" x="110" y="143" text-anchor="middle">인물 3명 · 3비트</text>
    <text class="t sb" x="110" y="162" text-anchor="middle">기획 카드</text>
  </g>
  <g>
    <rect x="217"  y="70" width="170" height="104" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t hd" x="302" y="100" text-anchor="middle">② 자산</text>
    <text class="t sb" x="302" y="124" text-anchor="middle">캐릭터 4뷰 시트</text>
    <text class="t sb" x="302" y="143" text-anchor="middle">장소 시트 [L1]</text>
    <text class="t sb" x="302" y="162" text-anchor="middle">0 크레딧</text>
  </g>
  <g>
    <rect x="409"  y="70" width="170" height="104" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t hd" x="494" y="100" text-anchor="middle">③ 콘티</text>
    <text class="t sb" x="494" y="124" text-anchor="middle">4패널 2×2</text>
    <text class="t sb" x="494" y="143" text-anchor="middle">승인받고 넘어간다</text>
    <text class="t sb" x="494" y="162" text-anchor="middle">0 크레딧</text>
  </g>
  <g>
    <rect x="601"  y="70" width="170" height="104" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t hd" x="686" y="100" text-anchor="middle">④ 키프레임</text>
    <text class="t sb" x="686" y="124" text-anchor="middle">단일 스틸 1장</text>
    <text class="t sb" x="686" y="143" text-anchor="middle">프레임 → 시작</text>
    <text class="t sb" x="686" y="162" text-anchor="middle">0 크레딧</text>
  </g>
  <g>
    <rect x="793"  y="70" width="170" height="104" rx="10" fill="#eef4ff" stroke="#2f81f7"/>
    <text class="t hd" x="878" y="100" text-anchor="middle">⑤ 장면</text>
    <text class="t sb" x="878" y="124" text-anchor="middle">10초 · Omni 1.1</text>
    <text class="t sb" x="878" y="143" text-anchor="middle">단일 샷 잠금</text>
    <text class="t cp" x="878" y="163" text-anchor="middle" fill="#b3541e">7~15 크레딧</text>
  </g>
  <g>
    <rect x="985"  y="70" width="170" height="104" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t hd" x="1070" y="100" text-anchor="middle">⑥ 진단</text>
    <text class="t sb" x="1070" y="124" text-anchor="middle">4턴 안에 수정</text>
    <text class="t sb" x="1070" y="143" text-anchor="middle">보존 · 시리즈</text>
    <text class="t sb" x="1070" y="162" text-anchor="middle">판정 기록</text>
  </g>

  <!-- 화살표 -->
  <g stroke="#8b949e" stroke-width="1.6" fill="none">
    <line x1="197" y1="122" x2="211" y2="122"/><path d="M211 122 l-6 -4 v8 z" fill="#8b949e" stroke="none"/>
    <line x1="389" y1="122" x2="403" y2="122"/><path d="M403 122 l-6 -4 v8 z" fill="#8b949e" stroke="none"/>
    <line x1="581" y1="122" x2="595" y2="122"/><path d="M595 122 l-6 -4 v8 z" fill="#8b949e" stroke="none"/>
    <line x1="773" y1="122" x2="787" y2="122"/><path d="M787 122 l-6 -4 v8 z" fill="#8b949e" stroke="none"/>
    <line x1="965" y1="122" x2="979" y2="122"/><path d="M979 122 l-6 -4 v8 z" fill="#8b949e" stroke="none"/>
  </g>

  <!-- 차시 -->
  <g class="t st" text-anchor="middle" fill="#8b949e">
    <text x="110" y="196">1차시</text>
    <text x="302" y="196">2차시</text>
    <text x="494" y="196">3차시</text>
    <text x="686" y="196">3차시</text>
    <text x="878" y="196">3차시</text>
    <text x="1070" y="196">4차시</text>
  </g>

  <!-- 비용 경계 -->
  <line x1="25" y1="216" x2="1155" y2="216" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <g class="t nt">
    <text x="25" y="243" fill="#1a7f37" font-weight="600">이미지 단계는 전부 0 크레딧</text>
    <text x="238" y="243">시트 · 장소 · 콘티 · 키프레임은 몇 번을 다시 뽑아도 무료다.</text>
    <text x="25" y="268" fill="#b3541e" font-weight="600">돈은 영상 생성에서 처음 나간다</text>
    <text x="238" y="268">360p 10초 = 7 크레딧 · 720p 10초 = 15 크레딧 (유료 계정 실측, 2026-09-30)</text>
  </g>
</svg>
